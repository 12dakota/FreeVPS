name: Cloudflare Infrastructure Service

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-network-service:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Robust binary download to guarantee zero apt/dpkg installation errors
      - name: Download and Install cloudflared
        run: |
          curl -L --output cloudflared https://github.com
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      # Installs the tunnel as an automated system service
      - name: Install Cloudflare Tunnel Service
        run: |
          sudo cloudflared service install eyJhIjoiZTI5NTBiNzdiYzI4OGU5MzY2YmViYmNjY2YxYzI1YTgiLCJ0IjoiY2ZmNGRjMWItYzIxOC00Mzg1LWFlNmEtMjI1NWNkMjk5Yzg4IiwicyI6Ik1tWXpORE01TldJdFpESmhPQzAwT0dWbExUazVNVEl0WTJFeVpEVXhOVFE1T0RBMiJ9

      # Starts the background system daemon and ensures it remains active
      - name: Start and Verify Service Status
        run: |
          sudo systemctl daemon-reload
          sudo systemctl start cloudflared
          sleep 3
          sudo systemctl status cloudflared

      # Keeps the GitHub Action job running so the tunnel connection stays active
      - name: Maintain Active Network Connection
        run: |
          echo "Tunnel background service running. Monitoring network activity..."
          # Continuously stream the tunnel system logs to your GitHub console
          sudo journalctl -u cloudflared -f
