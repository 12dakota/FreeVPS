name: Production Cloudflare Network Infrastructure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-network-service:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Faster, cleaner installation without package manager friction
      - name: Download and Install cloudflared
        run: |
          curl -L --output cloudflared https://github.com
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      # 2. Secure Token Injection: Prevents token hijacking if the repo is shared
      - name: Install Cloudflare Tunnel Service
        run: |
          sudo cloudflared service install ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

      # 3. Native systemd service alignment for Ubuntu 24.04
      - name: Start and Verify Service Status
        run: |
          sudo systemctl daemon-reload
          sudo systemctl start cloudflared
          sleep 3
          sudo systemctl status cloudflared

      # 4. EXPOSING LOCAL INFRASTRUCTURE (Optional Example)
      # If you want to test routing infrastructure, you can spin up local test endpoints 
      # here (like web servers, mock APIs, or Docker networks) for the tunnel to hook into.
      - name: Spin up a Mock Network Endpoint (Optional)
        run: |
          python3 -m http.server 8080 &
          echo "Local network endpoint listening on port 8080."

      # 5. Live logs stream and auto-timeout fail-safes
      - name: Maintain Active Network Connection & Stream Logs
        run: |
          echo "Tunnel network service is active. Streaming logs..."
          # Streams live logs into your GitHub terminal so you can watch connections happen in real-time
          sudo journalctl -u cloudflared -f
