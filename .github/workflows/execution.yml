name: Cloudflare Networking Infrastructure Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  establish-network-tunnel:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Zero-dependency installer: avoids apt repository sync issues completely
      - name: Download and Install cloudflared
        run: |
          curl -L --output cloudflared https://github.com
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Verify cloudflared Installation
        run: cloudflared --version

      # This runs the tunnel network connection directly from your secret token
      - name: Connect Local Infrastructure to Cloudflare
        run: |
          cloudflared tunnel --no-autoupdate run --token ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
